<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#32c888 0%,#1b5e20 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
    .container{background:rgba(255,255,255,.97);border-radius:24px;padding:35px;width:100%;max-width:480px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);animation:slideIn .5s ease-out}
    @keyframes slideIn{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
    .header{text-align:center;margin-bottom:25px}
    .header h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,#32c888,#1b5e20);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
    .header p{color:#64748b;font-size:13px}
    .btn{width:100%;padding:14px;border:none;border-radius:10px;font-family:'Poppins';font-weight:700;font-size:15px;cursor:pointer;transition:all .3s;margin-top:8px}
    .btn-primary{background:linear-gradient(135deg,#32c888,#1b5e20);color:#fff;box-shadow:0 10px 20px -5px rgba(50,200,136,.4)}
    .btn-primary:hover:not(:disabled){transform:translateY(-2px)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .btn-secondary{background:#f1f5f9;color:#64748b;margin-top:10px}
    .status{text-align:center;margin-top:12px;font-size:13px;color:#64748b;min-height:20px}
    .spinner{display:none;width:20px;height:20px;border:3px solid #e2e8f0;border-top-color:#32c888;border-radius:50%;animation:spin .8s linear infinite;margin:10px auto 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .info-box{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-left:4px solid #32c888;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:12px;color:#166534}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⬇️ Download Report</h1>
      <p>Export the current Report_View as PDF or CSV</p>
    </div>
    <div class="info-box">💡 Files save to Drive: <strong>All College Assessment Reports / College / Test</strong> and update the Email Registry.</div>
    <button class="btn btn-primary" id="pdfBtn" onclick="exportPDF()">📄 Export as PDF</button>
    <button class="btn btn-primary" id="csvBtn" onclick="exportCSV()" style="background:linear-gradient(135deg,#3b82f6,#1e40af)">📊 Export as CSV</button>
    <button class="btn btn-secondary" onclick="google.script.host.close()">✕ Close</button>
    <div class="spinner" id="spinner" role="status" aria-label="Loading"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
  <script>
    let isExporting=false;
    function exportPDF(){
      if(isExporting) return;
      isExporting=true;
      const btn=document.getElementById('pdfBtn'); btn.disabled=true; btn.textContent='⏳ Exporting PDF...';
      document.getElementById('spinner').style.display='block';
      showStatus('Exporting PDF... Please wait','info');
      google.script.run
        .withSuccessHandler(function(){ isExporting=false; btn.disabled=false; btn.textContent='📄 Export as PDF'; document.getElementById('spinner').style.display='none'; showStatus('✅ PDF export finished — check your Drive folder.','success'); })
        .withFailureHandler(function(err){ isExporting=false; btn.disabled=false; btn.textContent='📄 Export as PDF'; document.getElementById('spinner').style.display='none'; showStatus('❌ Error: '+err.message+' — Generate a report first.','error'); })
        .exportAsPDFFromDialog();
    }
    function exportCSV(){
      if(isExporting) return;
      isExporting=true;
      const btn=document.getElementById('csvBtn'); btn.disabled=true; btn.textContent='⏳ Exporting CSV...';
      document.getElementById('spinner').style.display='block';
      showStatus('Exporting CSV... Please wait','info');
      google.script.run
        .withSuccessHandler(function(){ isExporting=false; btn.disabled=false; btn.textContent='📊 Export as CSV'; document.getElementById('spinner').style.display='none'; showStatus('✅ CSV export finished — check your Drive folder.','success'); })
        .withFailureHandler(function(err){ isExporting=false; btn.disabled=false; btn.textContent='📊 Export as CSV'; document.getElementById('spinner').style.display='none'; showStatus('❌ Error: '+err.message+' — Generate a report first.','error'); })
        .exportAsCSVFromDialog();
    }
    function showStatus(msg,type){ const el=document.getElementById('status'); el.textContent=msg; el.style.color=type==='error'?'#ef4444':type==='success'?'#10b981':'#64748b'; }
  </script>
</body>
</html>
