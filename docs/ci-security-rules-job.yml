  # Job 3: Firestore / Storage / RTDB security rules against the emulator.
  # Compiles current-firestore.rules (a syntax error fails here, not at
  # deploy time) and runs functions/test/firestore.rules.test.ts.
  rules:
    name: Security rules (emulator)
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm i -g firebase-tools@13

      - name: Rules tests
        working-directory: functions
        run: npm run test:rules
