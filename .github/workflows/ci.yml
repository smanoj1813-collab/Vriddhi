# Continuous Integration pipeline for Vriddhi.
# This runs automatically on every push to `main` and on every pull request.
# It only BUILDS the code to catch errors early — it never deploys anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: build the frontend (React + Vite + TypeScript)
  frontend:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check for dead code in src/
        run: node scripts/check-dead-code.cjs

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Validate course packs
        run: npm run validate:courses

      - name: Render-check course pages
        run: npm run test:render:courses

      # The main render suite (~390 checks across every page section). It was
      # missing from CI, which is how 20 stale checks sat red on main unnoticed.
      - name: Render-check every page section
        run: npm run test:render

      - name: Render-check previous-year papers
        run: npm run test:render:pyq

      # Fails only on CRITICAL advisories: those are the ones with a known exploit
      # path and a patch. High/moderate are reported in the log for triage —
      # most of what remains is Node-only build tooling (grpc, undici, esbuild)
      # that never reaches a browser, and the firebase range has no patched
      # release to move to (see docs/COMPLETE_AUDIT_2026-11-11.md §3).
      - name: Dependency audit (blocks on critical only)
        run: |
          npm audit --audit-level=critical
          echo "── full report ──"
          npm audit || true

      - name: Build the frontend
        run: npm run build

  # Job 2: build the Cloud Functions backend (Express + TypeScript)
  functions:
    name: Functions build (Node 22)
    runs-on: ubuntu-latest
    env:
      # Skip Puppeteer's Chromium download during `npm ci`.
      # It isn't needed to compile TypeScript, and skipping it makes CI faster.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build the functions
        working-directory: functions
        run: npm run build

      - name: Functions unit tests
        working-directory: functions
        run: npm run test:unit

      - name: Course and related Firestore rules tests
        working-directory: functions
        run: npm run test:rules:course-security

      # The full rules suite (firestore + storage + database, ~100 cases).
      # BLOCKING. It was never run by CI before, and the first run found a rule
      # that could not be evaluated at all (classSessions update, 1000-expression
      # budget) — i.e. an outage that no other test could see. The step below is
      # kept so that any future failure names itself on the pull request.
      - name: Full security-rules suite
        id: rules
        working-directory: functions
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee /tmp/rules.log

      # Job logs are awkward to fetch from some environments, so the failing
      # cases are also emitted as check-run annotations — visible on the PR's
      # "Files changed"/checks tab without opening the raw log.
      - name: Report rules outcome
        if: always()
        continue-on-error: true
        run: |
          # Always report how many cases ran, so a silently shrinking suite is
          # visible on the pull request rather than looking like a pass.
          echo "::notice title=Rules suite::$(grep -aE '^# (pass|fail) ' /tmp/rules.log | tr '\n' ' ')"

          # Everything below is for a RED suite only. The log always contains
          # PERMISSION_DENIED lines (that is what assertFails() asserts), so
          # annotating them unconditionally painted a red annotation on green
          # runs — the exact noise this step exists to remove.
          if [ "${{ steps.rules.outcome }}" = "success" ]; then
            exit 0
          fi

          {
            echo "### Full security-rules suite is red"
            echo
            echo '```'
            grep -aE '^not ok|^ *not ok ' /tmp/rules.log | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=Security rules::the full suite failed — see the step summary for the failing cases"
          grep -aE '^not ok|^ *not ok ' /tmp/rules.log | head -30 | while IFS= read -r line; do
            echo "::error title=Security rules::$line"
          done
          echo "::error title=Rules failure detail (log tail)::$(tail -c 2000 /tmp/rules.log | tr '\n' ' ' | head -c 900)"

  # Job 3: real browser smoke tests.
  #
  # Everything else in this pipeline is jsdom or pure logic. Nothing verified
  # that the app boots in a browser: that `/` lands on the login screen, that a
  # deep link to a guarded route bounces, that the language switch repaints, or
  # that a 390 px phone does not scroll sideways. These four regressions have all
  # happened in products like this one; none of them can be caught by the render
  # harness, which mounts components in isolation.
  #
  # Scope stops at the sign-in wall on purpose: there is no Firebase project and
  # no emulator in CI, and faking a session would test the fake.
  browser:
    name: Browser smoke (Chromium)
    # Pinned rather than ubuntu-latest: the -latest label is mid-migration to
    # Ubuntu 26 (the runner prints a notice about it on every job), and
    # Playwright's `install --with-deps` apt recipe targets the current LTS. This
    # job failed on -latest for exactly that reason; a browser job that depends on
    # a moving OS image is a flake generator.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        id: chromium
        run: |
          set -o pipefail
          # Browser only, first. The runner image already carries the shared
          # libraries; `--with-deps` spends several minutes in apt and then fails
          # here (its recipe targets the previous LTS), which made this job take
          # 11 minutes to do 4 minutes of work. The launch probe below is what
          # decides whether the system packages are actually needed.
          npx playwright install chromium 2>&1 | tee /tmp/pw-install.log || true
          if node -e "require('@playwright/test').chromium.launch().then(b=>b.close()).then(()=>process.exit(0),()=>process.exit(1))"; then
            echo "Chromium launches — system libraries already present, no apt needed"
          else
            echo "::warning title=Chromium::launch failed without system packages, installing them"
            npx playwright install --with-deps chromium 2>&1 | tee -a /tmp/pw-install.log
          fi

      # A bare "exit code 1" tells nobody anything, and this pipeline's logs are
      # not reliably reachable — so the reason is pushed into an annotation.
      - name: Explain a failed browser install
        if: failure() && steps.chromium.outcome == 'failure'
        run: |
          echo "::error title=Chromium install failed::$(tail -c 900 /tmp/pw-install.log | tr '\n' ' ')"
          exit 1

      - name: Typecheck the browser tests
        run: npm run typecheck:e2e

      - name: Run the browser smoke tests
        run: npm run test:e2e

      # Turns "0/12 failed" into an actual state of the app: URL, title, visible
      # text, console errors — as annotations, because the log is not readable.
      - name: Diagnose the boot when the suite fails
        if: failure()
        run: node scripts/e2e-diagnose.mjs

      # Logs are not always reachable from where this pipeline is read, so the
      # failures also go to the checks API and the job summary.
      - name: Report browser results
        if: always()
        continue-on-error: true
        run: node scripts/e2e-annotate.mjs e2e-results.json

      - name: Keep the traces for a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            e2e-results.json
          if-no-files-found: ignore
          retention-days: 7
