# Continuous Integration pipeline for Vriddhi.
# This runs automatically on every push to `main` and on every pull request.
# It only BUILDS the code to catch errors early — it never deploys anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: build the frontend (React + Vite + TypeScript)
  frontend:
    name: Frontend build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check for dead code in src/
        run: node scripts/check-dead-code.cjs

      - name: Build the frontend
        run: npm run build

  # Job 2: build the Cloud Functions backend (Express + TypeScript)
  functions:
    name: Functions build (Node 20)
    runs-on: ubuntu-latest
    env:
      # Skip Puppeteer's Chromium download during `npm ci`.
      # It isn't needed to compile TypeScript, and skipping it makes CI faster.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build the functions
        working-directory: functions
        run: npm run build
