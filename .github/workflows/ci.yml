# Continuous Integration pipeline for Vriddhi.
# This runs automatically on every push to `main` and on every pull request.
# It only BUILDS the code to catch errors early — it never deploys anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: build the frontend (React + Vite + TypeScript)
  frontend:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check for dead code in src/
        run: node scripts/check-dead-code.cjs

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Validate course packs
        run: npm run validate:courses

      - name: Render-check course pages
        run: npm run test:render:courses

      # The main render suite (~390 checks across every page section). It was
      # missing from CI, which is how 20 stale checks sat red on main unnoticed.
      - name: Render-check every page section
        run: npm run test:render

      - name: Render-check previous-year papers
        run: npm run test:render:pyq

      # Fails only on CRITICAL advisories: those are the ones with a known exploit
      # path and a patch. High/moderate are reported in the log for triage —
      # most of what remains is Node-only build tooling (grpc, undici, esbuild)
      # that never reaches a browser, and the firebase range has no patched
      # release to move to (see docs/COMPLETE_AUDIT_2026-11-11.md §3).
      - name: Dependency audit (blocks on critical only)
        run: |
          npm audit --audit-level=critical
          echo "── full report ──"
          npm audit || true

      - name: Build the frontend
        run: npm run build

  # Job 2: build the Cloud Functions backend (Express + TypeScript)
  functions:
    name: Functions build (Node 22)
    runs-on: ubuntu-latest
    env:
      # Skip Puppeteer's Chromium download during `npm ci`.
      # It isn't needed to compile TypeScript, and skipping it makes CI faster.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build the functions
        working-directory: functions
        run: npm run build

      - name: Functions unit tests
        working-directory: functions
        run: npm run test:unit

      - name: Course and related Firestore rules tests
        working-directory: functions
        run: npm run test:rules:course-security

      # The full rules suite (firestore + storage + database, ~97 cases).
      # Non-blocking while it is red: it fails today and has never run in this
      # pipeline, so the failures are pre-existing, not this PR's. The step below
      # posts the failing cases onto the pull request so they can be triaged.
      - name: Full security-rules suite
        id: rules
        working-directory: functions
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee /tmp/rules.log

      - name: Report rules failures on the pull request
        if: steps.rules.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Full security-rules suite — failing cases'
            echo
            echo 'These come from the full suite (`npm run test:rules`), which was not in CI before.'
            echo 'They are pre-existing: triage them, then remove `continue-on-error` from the step.'
            echo
            echo '```'
            grep -aE '^not ok|^ *not ok ' /tmp/rules.log | head -40 || echo '(no "not ok" lines captured)'
            echo '```'
            echo
            echo '```'
            grep -aE '^# (pass|fail|tests) ' /tmp/rules.log | head -10 || true
            echo '```'
          } > /tmp/rules-report.md
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" --body-file /tmp/rules-report.md
          else
            cat /tmp/rules-report.md
          fi
